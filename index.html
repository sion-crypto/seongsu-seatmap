<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슈퍼패스트 성수 좌석배치도</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='9' fill='%23073763'/%3E%3Crect x='7' y='8' width='8' height='7' rx='2' fill='%23fff'/%3E%3Crect x='19' y='8' width='8' height='7' rx='2' fill='%23fff' fill-opacity='.6'/%3E%3Crect x='7' y='19' width='8' height='7' rx='2' fill='%23fff' fill-opacity='.6'/%3E%3Crect x='19' y='19' width='8' height='7' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#073763">
<style>
  :root{--bg:#f4f5f7;--ink:#1d2330;--mute:#6b7280;--line:#e3e6eb;--brand:#073763;--accent:#cc4125}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--brand);color:#fff;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
  .search{margin-left:auto;position:relative}
  .search input{width:260px;padding:8px 12px;border-radius:8px;border:0;font:inherit;font-size:14px}
  .results{position:absolute;right:0;top:40px;width:320px;max-height:360px;overflow:auto;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20;display:none}
  .results button{display:flex;justify-content:space-between;width:100%;padding:9px 12px;border:0;background:none;font:inherit;font-size:14px;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
  .results button:hover{background:#eef3fa}
  .results .fl{color:var(--accent);font-weight:700}
  .results .none{padding:12px;color:var(--mute);font-size:14px}
  .layout{flex:1;display:flex;min-height:0}
  aside{width:92px;background:#fff;border-right:1px solid var(--line);overflow:auto;flex:none}
  aside h2{font-size:12px;color:var(--mute);margin:12px 8px 6px;text-align:center;font-weight:700}
  .fl-item{display:block;width:100%;padding:11px 8px;text-align:center;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;cursor:default}
  .fl-item.has{cursor:pointer}
  .fl-item.has:hover{background:#eef3fa}
  .fl-item.on{background:#e4edf8;box-shadow:inset 4px 0 0 var(--brand)}
  .fl-item b{display:inline-block;font-size:16px;color:var(--brand)}
  .fl-item .org{font-size:13px}
  .fl-item .room{font-size:12px;color:var(--mute);margin:3px 0 0 38px}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tabs button,.zoom button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .stat{margin-left:12px;font-size:13px;color:var(--brand);font-weight:700}
  .zoom{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:13px;color:var(--mute)}
  .viewport{flex:1;overflow:auto;position:relative;background:#fff;cursor:grab}
  .viewport.drag{cursor:grabbing}
  .body{flex:1;display:flex;min-height:0}
  .panel{flex:1;min-width:340px;max-width:480px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .panel .ph{padding:14px 16px 8px;display:flex;align-items:center;gap:8px}
  .panel .ph b{font-size:17px;color:var(--brand);margin-right:auto;letter-spacing:-.3px}
  .panel .ph button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;color:#4b5565;cursor:pointer}
  .panel .ph button:hover{background:#eef3fa;color:var(--brand)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 16px 0}
  .tiles div{background:#f6f8fb;border-radius:10px;padding:8px 10px;font-size:11px;color:var(--mute)}
  .tiles div b{display:block;font-size:20px;line-height:1.2;color:var(--ink)}
  .tiles .u b{color:#1f6f43}.tiles .f b{color:#b3461d}
  .meter{margin:10px 16px 0;height:6px;border-radius:3px;background:#f0d9d0;overflow:hidden}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,#2e9e63,#4cc38a);border-radius:3px;transition:width .25s}
  .ptool{display:flex;gap:8px;padding:12px 16px 10px;align-items:center}
  .ptool input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:#f9fafb;outline:none}
  .ptool input:focus{border-color:var(--brand);background:#fff}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:6px 10px;font:inherit;font-size:12px;color:#4b5565;cursor:pointer}
  .seg button.on{background:var(--brand);color:#fff}
  .panel .pt{flex:1;overflow:auto;border-top:1px solid var(--line);background:#fbfcfd}
  .plist{column-count:2;column-gap:8px;padding:12px 12px 6px}
  .it{break-inside:avoid;display:flex;align-items:center;gap:8px;border:1px solid #e3e6eb;border-radius:10px;padding:4px 8px 4px 4px;margin-bottom:7px;background:#fff;transition:border-color .12s,box-shadow .12s}
  .it .sid{flex:none;min-width:44px;text-align:center;font-size:11px;font-weight:700;color:#4a6fa5;background:#e8effa;border-radius:7px;padding:7px 0}
  .it input{flex:1;min-width:0;border:0;font:inherit;font-size:14px;font-weight:700;color:var(--ink);outline:none;background:transparent;padding:6px 0}
  .it input::placeholder{color:#a9afba;font-weight:400}
  .it.free{border-style:dashed;background:#fafbfc}
  .it.free .sid{background:#eef0f3;color:#9aa1ad}
  .it.ed{border-color:#7bc27f;background:#f1faf1}
  .it.ed::after{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:#2e9e63}
  .it:hover,.it:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(204,65,37,.14)}
  .pempty{column-span:all;padding:28px 16px;text-align:center;color:var(--mute);font-size:13px}
  .panel .note{padding:8px 16px;font-size:11px;color:var(--mute);border-top:1px solid var(--line);line-height:1.5}
  @media(max-width:900px){.body{flex-direction:column}.panel{max-width:none;width:auto;height:40vh;border-left:0;border-top:1px solid var(--line)}}
  header{background:linear-gradient(135deg,#06294d,#0b4a85);box-shadow:0 2px 10px rgba(6,41,77,.25);position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:11px}
  .brand h1{line-height:1.15}
  .brand small{display:block;font-size:11px;font-weight:400;opacity:.7;letter-spacing:.5px;margin-top:1px}
  .search input{padding-left:36px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>") no-repeat 12px center;box-shadow:0 1px 4px rgba(0,0,0,.18);outline:none}
  .search input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
  aside{padding:6px 0;background:#fbfcfe}
  .fl-item{width:calc(100% - 16px);margin:3px 8px;border-radius:10px;transition:background .12s,transform .12s}
  .fl-item:not(.has){opacity:.32}
  .fl-item.on{background:var(--brand);box-shadow:0 3px 8px rgba(7,55,99,.3)}
  .fl-item.on b{color:#fff}
  .fl-item.has:hover:not(.on){transform:translateX(2px)}
  @media(min-width:801px){.tabs{display:none}}
  .bar{padding:9px 16px;gap:12px}
  .legend{display:flex;gap:12px;font-size:12px;color:#4b5565;align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:12px;height:12px;border-radius:4px;display:inline-block;box-sizing:border-box}
  .zoom{background:#f1f4f8;border-radius:11px;padding:3px;gap:2px}
  .zoom button{border:0!important;background:transparent!important;border-radius:8px!important;padding:6px 11px!important;color:#374151}
  .zoom button:hover{background:#fff!important;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .zoom #zv{min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
  .stat{background:#eaf1fb;padding:5px 11px;border-radius:20px;margin-left:0}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .stage{position:relative;margin:0}
  canvas{display:block}
  .hl{position:absolute;border:3px solid var(--accent);border-radius:6px;box-shadow:0 0 0 4px rgba(204,65,37,.3);pointer-events:none;animation:pulse 1s ease-in-out infinite;display:none}
  @keyframes pulse{50%{box-shadow:0 0 0 12px rgba(204,65,37,.08)}}
  .tip{position:fixed;pointer-events:none;background:#1d2330;color:#fff;padding:5px 9px;border-radius:6px;font-size:13px;white-space:pre;display:none;z-index:30}
  @media(max-width:800px){aside{display:none}.search input{width:180px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#fff" fill-opacity=".16"/><rect x="7" y="8" width="8" height="7" rx="2" fill="#fff"/><rect x="19" y="8" width="8" height="7" rx="2" fill="#fff" fill-opacity=".6"/><rect x="7" y="19" width="8" height="7" rx="2" fill="#fff" fill-opacity=".6"/><rect x="19" y="19" width="8" height="7" rx="2" fill="#fff"/></svg>
    <h1>슈퍼패스트 성수 좌석배치도<small>SUPERFAST SEONGSU · SEAT MAP</small></h1>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="이름 / 좌석번호 검색 (예: 키드, 5-4)" autocomplete="off">
    <div class="results" id="res"></div>
  </div>
</header>
<div class="layout">
  <aside id="side"><h2>층별 안내</h2></aside>
  <main>
    <div class="bar">
      <div class="tabs" id="tabs"></div>
      <span id="stat" class="stat"></span>
      <div class="legend"><span><i style="background:#fff;border:1.5px solid #4a78b8;border-top-width:3px"></i>사용</span><span><i style="border:1.5px dashed #aab0bb;background:#f4f5f7"></i>빈자리</span><span><i style="background:#fff1d6;border:1.5px solid #e0a73c"></i>회의실</span></div>
      <div class="zoom">
        <button id="mode">원본 도면 보기</button><button id="png">PNG 저장</button>
        <button id="zo">−</button><span id="zv">100%</span><button id="zi">+</button><button id="zf">맞춤</button>
      </div>
    </div>
    <div class="body">
      <div class="viewport" id="vp"><div class="stage" id="stage"><canvas id="cv"></canvas><div class="hl" id="hl"></div></div></div>
      <div class="panel" id="panel">
        <div class="ph"><b id="ptitle">좌석표</b><button id="pimp">가져오기</button><button id="pexp">내보내기</button><button id="prst">초기화</button></div>
        <div class="tiles" id="ptiles"></div>
        <div class="meter"><i id="pmeter"></i></div>
        <div class="ptool"><input id="pq" type="search" placeholder="좌석번호 · 이름 필터" autocomplete="off"><div class="seg" id="pseg"><button data-k="all" class="on">전체</button><button data-k="used">사용</button><button data-k="free">빈자리</button></div></div>
        <div class="pt"><div id="ptab" class="plist"></div></div>
        <div class="note">이름을 수정하면 배치도에 바로 반영됩니다. 비우면 빈자리가 됩니다. 수정 내용은 이 브라우저에만 저장됩니다.</div>
      </div>
    </div>
  </main>
</div>
<div class="tip" id="tip"></div>

  if(hasMain)for(let k=items.length-1;k>=0;k--){const i=items[k];if(i.t==="room"){if(!/meeting|회의/i.test(i.text))items.splice(k,1);else if(!i.text.startsWith(f.name+"-"))i.text=f.name+"-"+i.text}}

  if(pantry)for(let k=items.length-1;k>=0;k--){const i=items[k];if(i.t==='room'&&i.x>=pantry.x&&i.x<pantry.x+pantry.w&&i.y>=pantry.y&&i.y<pantry.y+pantry.h){pantry.text='탕비실 · '+i.text;items.splice(k,1)}}
  items.forEach(i=>{if(i.t!=='seat'){const mw=Math.max(54,i.text.length*13+16),mh=28;if(i.w<mw){i.x-=(mw-i.w)/2;i.w=mw}if(i.h<mh){i.y-=(mh-i.h)/2;i.h=mh}}});
  // 겹침 해소: 우선순위 좌석 > 회의실/시설 > 이름표. 낮은 쪽을 잘라내거나 밀어냄
  const GAP=6;
  const ov=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
  const blockers=[...islands];
  const resolveArea=a=>{
    for(let pass=0;pass<4;pass++){let hit=false;
      for(const b of blockers){if(!ov(a,b))continue;hit=true;
        const opts=[
          {c:a.x+a.w-(b.x-GAP),f:()=>{a.w=b.x-GAP-a.x}},
          {c:(b.x+b.w+GAP)-a.x,f:()=>{const r=a.x+a.w;a.x=b.x+b.w+GAP;a.w=r-a.x}},
          {c:a.y+a.h-(b.y-GAP),f:()=>{a.h=b.y-GAP-a.y}},
          {c:(b.y+b.h+GAP)-a.y,f:()=>{const r=a.y+a.h;a.y=b.y+b.h+GAP;a.h=r-a.y}}
        ].filter(o=>o.c>0).sort((p,q)=>p.c-q.c);
        opts[0].f();}
      if(!hit)break}
  };
  const bigAreas=areas.filter(a=>a.t==='mroom'||a.kind==='hall'||a.kind==='pantry'||a.kind==='wc'||a.kind==='stair'||a.kind==='ev');
  bigAreas.forEach(a=>{resolveArea(a);blockers.push(a)});
  // 이름표(룸 라벨)는 겹치면 겹치지 않는 방향으로 이동
  const placed=[...blockers];
  for(const r of items.filter(i=>i.t==='room')){
    for(let n=0;n<40;n++){const b=placed.find(p=>ov(r,p));if(!b)break;
      const dx=(b.x+b.w+GAP)-r.x,dy=(b.y+b.h+GAP)-r.y,lx=(b.x-GAP)-(r.x+r.w),ly=(b.y-GAP)-(r.y+r.h);
      const m=[[Math.abs(dx),()=>r.x+=dx],[Math.abs(dy),()=>r.y+=dy],[Math.abs(lx),()=>r.x+=lx],[Math.abs(ly),()=>r.y+=ly]].sort((p,q)=>p[0]-q[0])[0];m[1]()}
    placed.push(r);
  }
  // O.A · Closet & Cabinet 공간(엑셀 노란 음영, 행21~26)과 회의실 사이 출입로의 출입구 표시
  const fastRoom=areas.find(a=>a.t==='mroom'&&a.name==='Fast');
  if(fastRoom&&!HO){
    const c1=f.name==='8F'?57:49;
    const oa={t:'oa',text:'O.A · Closet & Cabinet',x:f.x[34],y:f.y[21],w:f.x[c1+1]-f.x[34],h:f.y[27]-f.y[21]};
    areas.push(oa);
    const gy=oa.y+oa.h,gh=fastRoom.y-gy;
    if(gh>24)areas.push({t:'door',text:'출입구',x:oa.x,y:gy+6,w:oa.w,h:gh-12});
  }
  [...items,...areas].forEach(i=>{if(!i.o)i.o={x:i.x,y:i.y,w:i.w,h:i.h}});
  // 3F/4F: 호실 단위로 좌석 묶음을 표준 크기 카드로 재배치하고, 호실 크기를 내용에 맞춰 정리
  if(HO){
    const hos=areas.filter(a=>a.t==='ho');
    const rank=(vals,tol)=>{const u=[...new Set(vals.map(v=>Math.round(v)))].sort((a,b)=>a-b),cs=[];u.forEach(v=>{const l=cs[cs.length-1];if(!l||v-l.last>tol)cs.push({last:v,vs:[v]});else{l.last=v;l.vs.push(v)}});return vals.map(v=>cs.findIndex(c=>c.vs.includes(Math.round(v))))};
    const groups=Object.values(cl).map(g=>{
      const x0=Math.min(...g.map(s=>s.o.x)),y0=Math.min(...g.map(s=>s.o.y));
      const cc=rank(g.map(s=>s.o.x),20),rr=rank(g.map(s=>s.o.y),12);
      g.forEach((s,i)=>{s.col=cc[i];s.row=rr[i]});
      return {g,x0,y0,nc:Math.max(...cc)+1,nr:Math.max(...rr)+1};
    });
    const SW=80,SH=48,PX=84,PY=52,PI=8,MAXIN=560;
    hos.forEach(h=>{h.pods=[]});
    groups.forEach(gr=>{const h=hos.find(h=>gr.x0>=h.o.x-2&&gr.x0<=h.o.x+h.o.w&&gr.y0>=h.o.y-2&&gr.y0<=h.o.y+h.o.h);if(h)h.pods.push(gr)});
    hos.forEach(h=>{
      const gs=h.pods.sort((a,b)=>a.y0-b.y0),bands=[];
      gs.forEach(gr=>{const b=bands[bands.length-1];if(b&&gr.y0<b.y+40)b.list.push(gr);else bands.push({y:gr.y0,list:[gr]})});
      let y=0,cw=0;
      bands.forEach(b=>{b.list.sort((a,c)=>a.x0-c.x0);let x=0,rowH=0;
        b.list.forEach(gr=>{gr.w=gr.nc*PX-4+2*PI;gr.h=gr.nr*PX*0+gr.nr*PY-4+2*PI;if(x>0&&x+gr.w>MAXIN){x=0;y+=rowH+14;rowH=0}gr.rx=x;gr.ry=y;x+=gr.w+14;rowH=Math.max(rowH,gr.h);cw=Math.max(cw,x-14)});
        y+=rowH+14});
      h.cw=cw;h.ch=Math.max(0,y-14);
      h.w=Math.max(180,h.cw+28);h.h=Math.max(90,h.ch+52);
    });
    // 호실 배치: 원본 행(위/가운데/아래) 순서 유지
    const rb=[];[...hos].sort((a,b)=>a.r0-b.r0).forEach(h=>{const b=rb[rb.length-1];if(b&&h.r0-b.r0<=12)b.list.push(h);else rb.push({r0:h.r0,list:[h]})});
    let cy=70;const nIsl=[];
    rb.forEach(b=>{b.list.sort((a,c)=>a.o.x-c.o.x);const bh=Math.max(...b.list.map(h=>h.h));b.list.forEach(h=>{h.h=bh});let x=30,rowH=0;
      b.list.forEach(h=>{h.x=x;h.y=cy;x+=h.w+18;rowH=Math.max(rowH,h.h);
        h.pods.forEach(gr=>{const ix=h.x+14+gr.rx,iy=h.y+38+gr.ry;
          gr.g.forEach(s=>{s.x=ix+PI+s.col*PX;s.y=iy+PI+s.row*PY;s.w=SW;s.h=SH});
          nIsl.push({x:ix,y:iy,w:gr.w,h:gr.h})})});
      cy+=rowH+22});
    islands.length=0;nIsl.forEach(i=>islands.push(i));
  }
  const all=[...items,...islands,...areas];
  if(!HO){
  // 빈 여백 압축: 아이템이 없는 넓은 간격을 줄여 한눈에 보이게 (상대 위치/순서 유지)
  const GAPMAX=1e6;
  for(const ax of [['x','w'],['y','h']]){
    const [p,s]=ax;
    const iv=all.map(i=>[i[p],i[p]+i[s]]).sort((a,b)=>a[0]-b[0]);
    const m=[];for(const v of iv){const l=m[m.length-1];if(l&&v[0]<=l[1])l[1]=Math.max(l[1],v[1]);else m.push([v[0],v[1]])}
    let ns=m[0][0];const sh=[];
    m.forEach((v,k)=>{if(k>0)ns+=Math.min(v[0]-m[k-1][1],GAPMAX);sh.push(ns-v[0]);ns+=v[1]-v[0]});
    all.forEach(i=>{const k=m.findIndex(v=>i[p]>=v[0]-0.01&&i[p]<=v[1]+0.01);i[p]+=sh[k]});
  }
  // 가로 간격 확대: 카드 크기는 그대로, 위치 간격만 넓힘
  const KX=1.25,X0=Math.min(...all.map(i=>i.x));
  const seatList=items.filter(i=>i.t==='seat');
  islands.forEach(isl=>{const nx=X0+(isl.x-X0)*KX,dx=nx-isl.x;
    seatList.forEach(s=>{if(!s._m&&s.x>=isl.x-1&&s.x+s.w<=isl.x+isl.w+1&&s.y>=isl.y-1&&s.y+s.h<=isl.y+isl.h+1){s.x+=dx;s._m=1}});isl.x=nx});
  [...areas,...items.filter(i=>i.t!=='seat')].forEach(i=>{i.x=X0+(i.x-X0)*KX;if(i.t==='ho')i.w*=KX});
  }
  const PAD=30,TOP=70;
  const ox=Math.min(...all.map(i=>i.x))-PAD,oy=Math.min(...all.map(i=>i.y))-TOP;
  all.forEach(i=>{i.x-=ox;i.y-=oy});
  const used=seats.filter(s=>s.name).length;
  f.sim={items,islands,areas,panels:[],W:Math.max(420,Math.max(...all.map(i=>i.x+i.w))+PAD),H:Math.max(...all.map(i=>i.y+i.h))+PAD,total:seats.length,used};
}
function drawSim(c,sc,W,H,f){

    c.textAlign='left';c.fillStyle='#073763';c.font='bold 18px "Malgun Gothic",sans-serif';c.fillText(p.title,p.x+18,p.y+26);

      rr(a.x,a.y,a.w,a.h,12);c.strokeStyle='#d9bd00';c.lineWidth=1.8;c.stroke();

      c.textAlign='center';c.fillStyle='#a3331a';fitT('🚪 출입구',a.w-14,16,true);c.fillText('🚪 출입구',a.x+a.w/2,a.y+a.h/2+1);

    }else if(i.t==='zone'){

function drawOrig(){
  const f=cur,dpr=window.devicePixelRatio||1;

  cv.style.width=f.W*scale+'px';cv.style.height=f.H*scale+'px';
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,f.W,f.H);
  // fills

      seg(bd[0],x0,y0,x0,y1);seg(bd[1],x1,y0,x1,y1);seg(bd[2],x0,y0,x1,y0);seg(bd[3],x0,y1,x1,y1);

  ctx.textBaseline='middle';

    const st=b.s>=0?STYLES[b.s]:{c:'#000',z:10,b:0,h:'',v:'',w:0};
    const px=Math.max(7,st.z*1.3333*0.92);
    ctx.font=(st.b?'bold ':'')+px+'px "Malgun Gothic",sans-serif';
    ctx.fillStyle=st.c;
    let lines=[];
    for(const ln of b.text.split('\n')){
      if(st.w&&b.w>20){let cur='';for(const ch of ln){if(ctx.measureText(cur+ch).width>b.w-4&&cur){lines.push(cur);cur=ch}else cur+=ch}lines.push(cur)}
      else lines.push(ln);
    }
    const lh=px*1.25,th=lines.length*lh;
    let y0=st.v==='top'?b.y+2+lh/2:st.v==='bottom'?b.y+b.h-th-2+lh/2:b.y+(b.h-th)/2+lh/2;
    const al=st.h||(/^[\d.,\-% ]+$/.test(b.text)?'right':'left');
    ctx.textAlign=al==='center'?'center':al==='right'?'right':'left';
    const tx=al==='center'?b.x+b.w/2:al==='right'?b.x+b.w-3:b.x+3;
    lines.forEach((l,i)=>ctx.fillText(l,tx,y0+i*lh));
  }
  stage.style.width=f.W*scale+'px';stage.style.height=f.H*scale+'px';
  sizeVp();placeHL();
}
function placeHL(){
  if(!hlBox||!cur){hl.style.display='none';return}
  const b=pos(hlBox),pad=3;
  hl.style.display='block';
  hl.style.left=(b.x-pad)*scale+'px';hl.style.top=(b.y-pad)*scale+'px';
  hl.style.width=(b.w+pad*2)*scale+'px';hl.style.height=(b.h+pad*2)*scale+'px';
}
function setScale(s){
  const cx=(vp.scrollLeft+vp.clientWidth/2)/scale,cy=(vp.scrollTop+vp.clientHeight/2)/scale;
  scale=Math.min(3,Math.max(.3,s));$('zv').textContent=Math.round(scale*100)+'%';draw();
  vp.scrollLeft=cx*scale-vp.clientWidth/2;vp.scrollTop=cy*scale-vp.clientHeight/2;
}
function sizeVp(){const bw=document.querySelector(".body").clientWidth,d=dims();if(innerWidth>900){vp.style.flex="none";vp.style.width=Math.min(d.W*scale+20,bw-340)+"px"}else{vp.style.flex="";vp.style.width=""}}
function reset100(all){const d=dims(),bw=document.querySelector(".body").clientWidth,aw=innerWidth>900?bw-340-24:vp.clientWidth-24;scale=all?Math.max(.25,Math.min(1.5,aw/d.W,(vp.clientHeight-16)/d.H)):1;$("zv").textContent=Math.round(scale*100)+"%";draw();vp.scrollLeft=0;vp.scrollTop=0}
function fit(){reset100(true)}
function show(name,box){
  cur=byName[name];hlBox=box||null;
  mode=seatsOf(cur).length?'simple':'orig';   // 좌석 없는 층(2F~4F)은 원본 도면 형태로 표시
  $('mode').textContent=mode==='simple'?'원본 도면 보기':'간소화 보기';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===name));
  document.querySelectorAll('.fl-item').forEach(b=>b.classList.toggle('on',b.dataset.f===name));
  renderPanel();
  reset100();
  if(box){const p=pos(box);scale=Math.max(scale,1);$('zv').textContent=Math.round(scale*100)+'%';draw();
    vp.scrollLeft=(p.x+p.w/2)*scale-vp.clientWidth/2;vp.scrollTop=(p.y+p.h/2)*scale-vp.clientHeight/2}
  history.replaceState(null,'','#'+name);
}
/* ---------- 좌석표(편집) ---------- */
const LS='seongsu-seat-edits-v1';
let EDITS={};
try{EDITS=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){EDITS={}}
function saveEdits(){try{localStorage.setItem(LS,JSON.stringify(EDITS))}catch(e){}}
const seatsOf=f=>f.sim.items.filter(i=>i.t==='seat');
const idNum=id=>id.split('-').map(Number);
function setSeatName(s,v){s.name=v;s.text=s.id+(v?'\n'+v:'')}
function recount(f){f.sim.used=seatsOf(f).filter(s=>s.name).length}
FLOORS.forEach(f=>{seatsOf(f).forEach(s=>{s.name0=s.name;const e=EDITS[f.name];if(e&&Object.prototype.hasOwnProperty.call(e,s.id))setSeatName(s,e[s.id])});recount(f)});
let pFilter='all',pQuery='';
function updSum(){
  const f=cur,seats=seatsOf(f),n=seats.length,u=seats.filter(s=>s.name).length;
  $('ptiles').innerHTML=n?`<div><b>${n}</b>전체 좌석</div><div class="u"><b>${u}</b>사용 중</div><div class="f"><b>${n-u}</b>빈자리</div>`:'';
  $('pmeter').style.width=n?(u/n*100)+'%':'0';
  $('pmeter').parentElement.style.display=n?'':'none';
}
function renderPanel(){
  const f=cur,all=seatsOf(f).slice().sort((a,b)=>{const x=idNum(a.id),y=idNum(b.id);return x[0]-y[0]||x[1]-y[1]});
  $('ptitle').textContent=f.name+' 좌석표';
  updSum();
  const t=$('ptab');t.innerHTML='';
  if(!all.length){t.innerHTML='<div class="pempty">이 층에는 좌석이 없습니다.</div>';return}
  const q=pQuery.trim().toLowerCase();
  const seats=all.filter(s=>(pFilter==='all'||(pFilter==='used'?s.name:!s.name))&&(!q||(s.id+' '+s.name).toLowerCase().includes(q)));
  if(!seats.length){t.innerHTML='<div class="pempty">조건에 맞는 좌석이 없습니다.</div>';return}
  seats.forEach(s=>{
    const row=document.createElement('div');row.className='it';
    const sid=document.createElement('span');sid.className='sid';sid.textContent=s.id;
    const inp=document.createElement('input');inp.type='text';inp.value=s.name||'';inp.placeholder='빈자리';inp.setAttribute('aria-label',s.id+' 성명');
    const mark=()=>{row.classList.toggle('ed',s.name!==s.name0);row.classList.toggle('free',!s.name)};
    mark();
    inp.addEventListener('input',()=>{
      setSeatName(s,inp.value.trim());
      const e=EDITS[f.name]=EDITS[f.name]||{};
      if(s.name===s.name0)delete e[s.id];else e[s.id]=s.name;
      if(!Object.keys(e).length)delete EDITS[f.name];
      saveEdits();recount(f);mark();updSum();draw();
    });
    const on=()=>{hlBox=s;placeHL()},off=()=>{if(document.activeElement!==inp){hlBox=null;placeHL()}};
    inp.addEventListener('focus',on);inp.addEventListener('blur',()=>{hlBox=null;placeHL()});
    row.addEventListener('mouseenter',on);row.addEventListener('mouseleave',off);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=[...t.querySelectorAll('input')];const i=a.indexOf(inp);(a[i+1]||inp).focus()}});
    row.appendChild(sid);row.appendChild(inp);t.appendChild(row);
  });
}
$('pq').addEventListener('input',e=>{pQuery=e.target.value;renderPanel()});
$('pseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;pFilter=b.dataset.k;[...$('pseg').children].forEach(x=>x.classList.toggle('on',x===b));renderPanel()});
$('prst').onclick=()=>{
  if(!EDITS[cur.name]||!confirm(cur.name+'의 수정 내용을 모두 되돌릴까요?'))return;
  delete EDITS[cur.name];saveEdits();
  seatsOf(cur).forEach(s=>setSeatName(s,s.name0));recount(cur);renderPanel();draw();
};
$('pexp').onclick=()=>{
  const b=new Blob([JSON.stringify(EDITS,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='좌석수정내용.json';a.click();
};
$('pimp').onclick=()=>{
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);EDITS=d&&typeof d==='object'?d:{};saveEdits();
      FLOORS.forEach(f=>{seatsOf(f).forEach(s=>{const e=EDITS[f.name];setSeatName(s,e&&Object.prototype.hasOwnProperty.call(e,s.id)?e[s.id]:s.name0)});recount(f)});
      renderPanel();draw();
    }catch(e){alert('가져오기에 실패했습니다. 내보내기로 저장한 JSON 파일을 선택해 주세요.')}};
    r.readAsText(i.files[0])};
  i.click();
};
// UI build
const names=FLOORS.map(f=>f.name).reverse();
names.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.dataset.f=n;b.onclick=()=>show(n);$('tabs').appendChild(b)});
INFO.forEach(([n,org,room])=>{
  const b=document.createElement('button');b.className='fl-item'+(byName[n]?' has':'');b.dataset.f=n;
  b.innerHTML='<b>'+n+'</b>';
  if(byName[n])b.onclick=()=>show(n);
  $('side').appendChild(b);
});
$('png').onclick=savePng;
$('mode').onclick=()=>{mode=mode==='simple'?'orig':'simple';$('mode').textContent=mode==='simple'?'원본 도면 보기':'간소화 보기';reset100()};
$('zi').onclick=()=>setScale(scale*1.2);$('zo').onclick=()=>setScale(scale/1.2);$('zf').onclick=fit;
vp.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setScale(scale*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
// drag to pan
let drag=null;
vp.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,l:vp.scrollLeft,t:vp.scrollTop};vp.classList.add('drag')});
window.addEventListener('mouseup',()=>{drag=null;vp.classList.remove('drag')});
window.addEventListener('mousemove',e=>{if(drag){vp.scrollLeft=drag.l-(e.clientX-drag.x);vp.scrollTop=drag.t-(e.clientY-drag.y)}});
// tooltip
let hoverItem=null,downAt=null;
cv.addEventListener('mousemove',e=>{
  if(drag){tip.style.display='none';return}
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/scale,y=(e.clientY-r.top)/scale;
  const b=(mode==='simple'?cur.sim.items.concat(cur.sim.areas):cur.boxes).find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h&&b.text.length<40);
  if(b){tip.textContent=b.text.replace(/\n/g,'  ·  ');tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+14+'px'}else tip.style.display='none';
  const hv=(mode==='simple'&&b&&b.t==='seat')?b:null;
  cv.style.cursor=hv?'pointer':'';
  if(hv!==hoverItem){hoverItem=hv;draw()}
});
cv.addEventListener('mouseleave',()=>{tip.style.display='none';if(hoverItem){hoverItem=null;draw()}});
cv.addEventListener('mousedown',e=>{downAt=[e.clientX,e.clientY]});
cv.addEventListener('click',e=>{
  if(!hoverItem||!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>4)return;
  const id=hoverItem.id;pFilter='all';pQuery='';$('pq').value='';[...$('pseg').children].forEach((x,i)=>x.classList.toggle('on',i===0));renderPanel();
  const inp=[...document.querySelectorAll('#ptab input')].find(i=>i.getAttribute('aria-label')===id+' 성명');
  if(inp){inp.scrollIntoView({block:'center',behavior:'smooth'});inp.focus();inp.select()}
});
// search
const q=$('q'),res=$('res');
function search(){
  const k=q.value.trim().toLowerCase();
  if(!k){res.style.display='none';return}
  const hits=[],seen=new Set();
  for(const f of FLOORS)for(const b of f.sim.items.concat(f.sim.areas)){
    if(b.text.length>40||!b.text.toLowerCase().includes(k))continue;
    const key=f.name+'|'+b.text.replace(/\n/g,' ');if(seen.has(key))continue;seen.add(key);
    hits.push([f,b]);
  }
  res.innerHTML='';res.style.display='block';
  if(!hits.length){res.innerHTML='<div class="none">검색 결과가 없습니다</div>';return}
  hits.slice(0,60).forEach(([f,b])=>{
    const el=document.createElement('button');
    el.innerHTML='<span></span><span class="fl">'+f.name+'</span>';
    el.firstChild.textContent=b.text.replace(/\n/g,'  ·  ');
    el.onclick=()=>{res.style.display='none';show(f.name,b)};
    res.appendChild(el);
  });
}
q.addEventListener('input',search);
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=res.querySelector('button');if(f)f.click()}if(e.key==='Escape')res.style.display='none'});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.style.display='none'});
window.addEventListener('resize',()=>{if(cur)reset100()});
show(byName[location.hash.slice(1)]?location.hash.slice(1):'5F');
</script>
